<text x='48' y='74' font-size='15' fill='#52514e'>Anatomia do evento E03: café 500 g na Rede nacional, encarte + ponto extra com 15% de desconto, 1 semana. R$ mil.</text>
<text x='48' y='96' font-size='15' fill='#52514e'>Canibalizou 32% do incremental nos outros cafés e antecipou 36% das compras das 2 semanas seguintes.</text>
