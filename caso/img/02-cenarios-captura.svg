<text x='48' y='44' font-size='24' font-weight='700' fill='#0b0b0b'>No pior cenário, o plano rende R$ 2,45 mi por ano; não agir pode render zero</text>
<text x='48' y='74' font-size='15' fill='#52514e'>Ganho de margem de bolso contra hoje, em R$ mi por ano, em 2033 e, embaixo, em 2027. Total em disputa em 2033: R$ 4,25 mi.</text>
<text x='48' y='96' font-size='15' fill='#52514e'>Capturar tudo rende mais no papel, mas exige que o varejo com crédito aceite uma alta de preço líquido sem ganho próprio.</text>
