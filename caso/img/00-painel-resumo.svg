<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 690' width='1100' height='690' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect width='1100' height='690' rx='12' fill='#fcfcfb'/>
<text x='48' y='48' font-size='15' font-weight='600' fill='#52514e'>VALE ALTO ALIMENTOS · EMPRESA FICTÍCIA · 52 SEMANAS</text>
<text x='48' y='86' font-size='28' font-weight='700' fill='#0b0b0b'>R$ 1,96 mi por ano de margem de bolso (+8,1%),</text>
<text x='48' y='120' font-size='28' font-weight='700' fill='#0b0b0b'>mais R$ 2,45 mi protegidos na reforma tributária</text>
<rect x='48' y='150' width='492' height='210' rx='10' fill='#ffffff' stroke='#e4e3df'/>
<rect x='48' y='150' width='6' height='210' rx='3' fill='#2a78d6'/>
<text x='76' y='186' font-size='14' font-weight='600' fill='#52514e'>01 · Price waterfall</text>
<text x='76' y='236' font-size='40' font-weight='700' fill='#0b0b0b'>R$ 0,84 mi</text>
<text x='76' y='260' font-size='14' fill='#52514e'>por ano recuperáveis</text>
<text x='76' y='296' font-size='14' fill='#0b0b0b'>19,8% da receita a preço de lista não chega ao bolso.</text>
<text x='76' y='316' font-size='14' fill='#0b0b0b'>Três condições fora da política e dois custos de</text>
<text x='76' y='336' font-size='14' fill='#0b0b0b'>servir explicam a parte que dá para recuperar.</text>
<rect x='560' y='150' width='492' height='210' rx='10' fill='#ffffff' stroke='#e4e3df'/>
<rect x='560' y='150' width='6' height='210' rx='3' fill='#2a78d6'/>
<text x='588' y='186' font-size='14' font-weight='600' fill='#52514e'>02 · Reforma tributária (CBS/IBS)</text>
<text x='588' y='236' font-size='40' font-weight='700' fill='#0b0b0b'>R$ 2,45 mi</text>
<text x='588' y='260' font-size='14' fill='#52514e'>por ano, no mínimo, em 2033</text>
<text x='588' y='296' font-size='14' fill='#0b0b0b'>R$ 4,25 mi ficam em disputa. No varejo com crédito,</text>
<text x='588' y='316' font-size='14' fill='#0b0b0b'>a reforma não muda o custo do cliente: sem</text>
<text x='588' y='336' font-size='14' fill='#0b0b0b'>negociação, quem retém a queda é o varejista.</text>
<rect x='48' y='380' width='492' height='210' rx='10' fill='#ffffff' stroke='#e4e3df'/>
<rect x='48' y='380' width='6' height='210' rx='3' fill='#2a78d6'/>
<text x='76' y='416' font-size='14' font-weight='600' fill='#52514e'>03 · Retorno de promoção</text>
<text x='76' y='466' font-size='40' font-weight='700' fill='#0b0b0b'>R$ 0,50 mi</text>
<text x='76' y='490' font-size='14' fill='#52514e'>por ano ao cortar e redesenhar</text>
<text x='76' y='526' font-size='14' fill='#0b0b0b'>R$ 1,00 mi investido devolveu −R$ 0,56 mi.</text>
<text x='76' y='546' font-size='14' fill='#0b0b0b'>15 de 27 eventos destroem margem com segurança</text>
<text x='76' y='566' font-size='14' fill='#0b0b0b'>estatística; nenhum comprovadamente se paga.</text>
<rect x='560' y='380' width='492' height='210' rx='10' fill='#ffffff' stroke='#e4e3df'/>
<rect x='560' y='380' width='6' height='210' rx='3' fill='#2a78d6'/>
<text x='588' y='416' font-size='14' font-weight='600' fill='#52514e'>04 · Price-pack architecture</text>
<text x='588' y='466' font-size='40' font-weight='700' fill='#0b0b0b'>R$ 0,62 mi</text>
<text x='588' y='490' font-size='14' fill='#52514e'>por ano no cenário base</text>
<text x='588' y='526' font-size='14' fill='#0b0b0b'>O 2 L tem 75% dos litros e paga R$ 0,80 por litro.</text>
<text x='588' y='546' font-size='14' fill='#0b0b0b'>Um 1,5 L abre o degrau que permite repreçar o 2 L.</text>
<text x='588' y='566' font-size='14' fill='#0b0b0b'>Baixar o multipack perderia R$ 143 mil.</text>
<text x='48' y='646' font-size='14' fill='#0b0b0b'><tspan font-weight='700'>O fio que liga os quatro:</tspan> o refrigerante 2 L é o maior vazamento, a promoção que só antecipa compra,</text>
<text x='48' y='666' font-size='14' fill='#0b0b0b'>o item sem margem para o Imposto Seletivo e o tamanho que precisa de um degrau abaixo. Somas indicativas, sem dupla contagem relevante.</text>
</svg>